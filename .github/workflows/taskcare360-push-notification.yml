name: TaskCare360 Push Scheduler

on:
  schedule:
    # Every 3 hours (testing). GitHub may delay 1-15 min under load.
    - cron: '* */3 * * *'
  
  # Allows manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Hit TaskCare360 push endpoint
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: python taskcare360_push_trigger.py