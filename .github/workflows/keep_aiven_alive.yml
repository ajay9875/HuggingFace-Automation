name: Keep Aiven Services Alive

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:

jobs:
  keep-aiven-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary PyMySQL

      - name: Run Aiven Keeper Script
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
        run: python keep_aiven_alive.py